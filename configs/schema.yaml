# Data schemas for TALA Multimodal AI Strategy project
# Used by src/validation.py and scripts/validate_data.py.
#
# EVIDENCE TYPE DISCIPLINE:
#   official          → brand website, press releases, sustainability pages
#   customer_experience → Trustpilot, Reddit, complaints, product reviews, press
#   creator_strategy  → creator/influencer posts, paid partnerships, brand tags
#   brand_positioning → brand-owned social content (Instagram, TikTok, YouTube)
#   competitor_benchmark → competitor platform snapshots
#   press             → journalism, editorial, NGO assessments
#   community         → Reddit threads, forums, public complaint discussions
#   assessment        → researcher-produced claim divergence assessments
#
# Common provenance fields (required on ALL schemas):
#   source_url       URL of the specific piece of content
#   source_platform  Domain or platform name (e.g. trustpilot.com, instagram, weartala.com)
#   collection_date  YYYY-MM-DD when the row was collected
#   collected_by     Team member name or initials
#   evidence_type    One of the types above (schema-specific allowed values listed below)
#   citation_ready   bool: true when URL, date, and text have been verified for citation
#   notes            Free-text researcher notes

schemas:

  social_posts:
    description: >
      Brand-owned or brand-tagged posts on Instagram, TikTok, or YouTube.
      Evidence for BRAND POSITIONING only — not quality or sustainability.
    fields:
      post_id:          { dtype: str,      required: true }
      brand:            { dtype: str,      required: true }
      platform:         { dtype: str,      required: true,  values: [instagram, tiktok, youtube] }
      post_date:        { dtype: date,     required: true }
      caption:          { dtype: str,      required: false }
      media_type:       { dtype: str,      required: false, values: [image, video, reel, story, carousel] }
      hashtags:         { dtype: list_str, required: false }
      likes:            { dtype: int,      required: false }
      comments:         { dtype: int,      required: false }
      views:            { dtype: int,      required: false }
      image_path:       { dtype: str,      required: false }
      source_url:       { dtype: str,      required: true }
      source_platform:  { dtype: str,      required: true }
      collection_date:  { dtype: date,     required: true }
      collected_by:     { dtype: str,      required: true }
      evidence_type:    { dtype: str,      required: true,  values: [brand_positioning] }
      notes:            { dtype: str,      required: false }
      citation_ready:   { dtype: bool,     required: false, default: false }
      source_id:        { dtype: str,      required: true }
      synthetic:        { dtype: bool,     required: true,  default: false }

  creator_posts:
    description: >
      Posts by creators/influencers who partner with or organically mention the brand.
      Evidence for CREATOR STRATEGY, reach, and partnership diversity.
      Do not use as evidence for quality or sustainability claims.
    fields:
      post_id:          { dtype: str,      required: false }
      brand:            { dtype: str,      required: true }
      creator_handle:   { dtype: str,      required: false }
      platform:         { dtype: str,      required: true,  values: [instagram, tiktok, youtube, other] }
      post_date:        { dtype: date,     required: false }
      partnership_type: { dtype: str,      required: false, values: [paid, gifted, organic, ambassador, unknown] }
      caption:          { dtype: str,      required: false }
      creator_followers: { dtype: int,      required: false }
      creator_tier:     { dtype: str,      required: false, values: [nano, micro, mid, macro, mega] }
      likes:            { dtype: int,      required: false }
      comments:         { dtype: int,      required: false }
      views:            { dtype: int,      required: false }
      sentiment_label:  { dtype: str,      required: false, values: [positive, neutral, negative, mixed] }
      source_url:       { dtype: str,      required: true }
      source_platform:  { dtype: str,      required: true }
      collection_date:  { dtype: date,     required: true }
      collected_by:     { dtype: str,      required: true }
      evidence_type:    { dtype: str,      required: true,  values: [creator_strategy] }
      notes:            { dtype: str,      required: false }
      citation_ready:   { dtype: bool,     required: false, default: false }
      source_id:        { dtype: str,      required: true }
      synthetic:        { dtype: bool,     required: true,  default: false }

  customer_reviews:
    description: >
      Customer reviews from Trustpilot, Google, Sitejabber, Reddit, or similar.
      PRIMARY evidence for quality, fit, sizing, durability, returns, and complaints.
      Strip usernames before saving. Do not store PII.
    fields:
      review_id:        { dtype: str,      required: false }
      brand:            { dtype: str,      required: true }
      platform:         { dtype: str,      required: true }
      review_date:      { dtype: date,     required: false }
      star_rating:      { dtype: float,    required: false, min: 1.0, max: 5.0 }
      review_text:      { dtype: str,      required: true }
      topics_mentioned: { dtype: list_str, required: false }
      verified_purchase: { dtype: bool,     required: false }
      sentiment_label:  { dtype: str,      required: false, values: [positive, neutral, negative, mixed] }
      complaint_type:   { dtype: str,      required: false, values: [quality, fit, sizing, delivery, returns, customer_service, sustainability, other, none] }
      source_url:       { dtype: str,      required: true }
      source_platform:  { dtype: str,      required: true }
      collection_date:  { dtype: date,     required: true }
      collected_by:     { dtype: str,      required: true }
      evidence_type:    { dtype: str,      required: true,  values: [customer_experience] }
      notes:            { dtype: str,      required: false }
      citation_ready:   { dtype: bool,     required: false, default: false }
      source_id:        { dtype: str,      required: true }
      synthetic:        { dtype: bool,     required: true,  default: false }

  official_claims:
    description: >
      Claims made by the brand in official communications: website copy, press releases,
      impact/sustainability reports, packaging, investor statements.
      PRIMARY corpus for claim validation. Copy verbatim; include URL and access date.
    fields:
      claim_id:         { dtype: str,      required: true }
      brand:            { dtype: str,      required: true }
      claim_text:       { dtype: str,      required: true }
      claim_category:   { dtype: str,      required: true,  values: [quality, sustainability, inclusivity, performance, ethics, community, pricing, other] }
      source_type:      { dtype: str,      required: true,  values: [website, press_release, impact_report, packaging, social_bio, campaign_copy, interview, other] }
      verifiable:       { dtype: bool,     required: false }
      evidence_strength: { dtype: str,      required: false, values: [strong, moderate, weak, unverifiable] }
      source_url:       { dtype: str,      required: true }
      source_platform:  { dtype: str,      required: true }
      collection_date:  { dtype: date,     required: true }
      collected_by:     { dtype: str,      required: true }
      evidence_type:    { dtype: str,      required: true,  values: [official] }
      notes:            { dtype: str,      required: false }
      citation_ready:   { dtype: bool,     required: false, default: false }
      source_id:        { dtype: str,      required: true }
      synthetic:        { dtype: bool,     required: true,  default: false }

  competitor_platforms:
    description: >
      Aggregated platform-presence snapshots for competitive benchmarking.
      One row per brand × platform combination. Capture date is critical.
    fields:
      brand:              { dtype: str,    required: true }
      platform:           { dtype: str,    required: true,  values: [instagram, tiktok, youtube, website] }
      followers:          { dtype: int,    required: false }
      following:          { dtype: int,    required: false }
      avg_post_frequency: { dtype: float,  required: false }
      creator_tier_mix:   { dtype: str,    required: false }
      content_format_mix: { dtype: str,    required: false }
      verified_account:   { dtype: bool,   required: false }
      source_url:         { dtype: str,    required: true }
      source_platform:    { dtype: str,    required: true }
      collection_date:    { dtype: date,   required: true }
      collected_by:       { dtype: str,    required: true }
      evidence_type:      { dtype: str,    required: true,  values: [competitor_benchmark, focal_platform_baseline] }
      notes:              { dtype: str,    required: false }
      citation_ready:     { dtype: bool,   required: false, default: false }
      source_id:          { dtype: str,    required: true }
      synthetic:          { dtype: bool,   required: true,  default: false }

  press_reddit_sources:
    description: >
      Press articles, Reddit threads, blog posts, and community discussions.
      Used as CUSTOMER EXPERIENCE and PRESS evidence for quality, sustainability,
      and responsibility claim validation. Never use as creator strategy evidence.
    fields:
      source_id:        { dtype: str,      required: true }
      brand:            { dtype: str,      required: true }
      source_type:      { dtype: str,      required: true,  values: [press, reddit, blog, forum, news, podcast, other] }
      publication:      { dtype: str,      required: true }
      title:            { dtype: str,      required: true }
      author:           { dtype: str,      required: false }
      date_published:   { dtype: date,     required: false }
      summary:          { dtype: str,      required: false }
      key_quote:        { dtype: str,      required: false }
      topics_mentioned: { dtype: list_str, required: false }
      sentiment_label:  { dtype: str,      required: false, values: [positive, neutral, negative, mixed] }
      source_url:       { dtype: str,      required: true }
      source_platform:  { dtype: str,      required: true }
      collection_date:  { dtype: date,     required: true }
      collected_by:     { dtype: str,      required: true }
      evidence_type:    { dtype: str,      required: true,  values: [press, community] }
      notes:            { dtype: str,      required: false }
      citation_ready:   { dtype: bool,     required: false, default: false }
      synthetic:        { dtype: bool,     required: true,  default: false }

  # ── Day 2 schemas ──────────────────────────────────────────────────────────
  # These describe files produced by scripts/hydrate_day2_sources.py.
  # They intentionally do NOT reuse the Day 1 candidate schemas above (official_claims,
  # creator_posts, etc.) even though some filenames share a substring with them — the
  # Day 2 files have a different column layout (RAG-corpus export / enriched interim
  # shape) and must be routed to these definitions explicitly. See
  # EXACT_FILENAME_SCHEMA in src/validation.py.
  #
  # Field lists below reflect the ACTUAL columns written by hydrate_day2_sources.py as
  # of 2026-09-18 (verified against the generated CSVs) — fields the earlier spec
  # mentioned but that are not present in the corpus export (e.g. claim_text,
  # claim_category, numerical_claim on official_claims_corpus) live upstream in
  # data/interim/day2/claims_expanded.csv, not in the corpus file, and are therefore
  # left out here rather than invented as columns that don't exist.

  official_claims_corpus:
    description: >
      RAG-ready corpus of official TALA/competitor claims, built from hydrated
      official_claims source pages (Part C/G of hydrate_day2_sources.py). One row =
      one extracted claim sentence. evidence_strength reflects the SOURCE PAGE's
      hydration quality, not the length of the individual sentence.
    fields:
      document_id:        { dtype: str,  required: true }
      corpus:              { dtype: str,  required: true,  values: [official_claims] }
      brand:                { dtype: str,  required: true }
      source_platform:    { dtype: str,  required: true }
      source_url:          { dtype: str,  required: true }
      document_title:      { dtype: str,  required: false }
      publication_date:    { dtype: str,  required: false }
      extracted_text:      { dtype: str,  required: false }
      evidence_strength:  { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      rag_usable:          { dtype: bool, required: true,  values: [true, false] }
      retrieved_at:        { dtype: str,  required: true }
      provenance_note:    { dtype: str,  required: true }

  customer_experience_corpus:
    description: >
      RAG-ready corpus of customer-experience evidence (reviews + press), built in
      Part G of hydrate_day2_sources.py from customer_reviews and press_reddit_sources.
    fields:
      document_id:        { dtype: str,  required: true }
      corpus:              { dtype: str,  required: true,  values: [customer_experience] }
      brand:                { dtype: str,  required: true }
      source_platform:    { dtype: str,  required: true }
      source_url:          { dtype: str,  required: true }
      document_title:      { dtype: str,  required: false }
      publication_date:    { dtype: str,  required: false }
      extracted_text:      { dtype: str,  required: false }
      evidence_strength:  { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      rag_usable:          { dtype: bool, required: true,  values: [true, false] }
      retrieved_at:        { dtype: str,  required: true }
      provenance_note:    { dtype: str,  required: true }

  creator_strategy_corpus:
    description: >
      RAG-ready corpus of verified creator-post evidence, built in Part G of
      hydrate_day2_sources.py from enriched creator_posts.
    fields:
      document_id:        { dtype: str,  required: true }
      corpus:              { dtype: str,  required: true,  values: [creator_strategy] }
      brand:                { dtype: str,  required: true }
      source_platform:    { dtype: str,  required: true }
      source_url:          { dtype: str,  required: true }
      document_title:      { dtype: str,  required: false }
      publication_date:    { dtype: str,  required: false }
      extracted_text:      { dtype: str,  required: false }
      evidence_strength:  { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      rag_usable:          { dtype: bool, required: true,  values: [true, false] }
      retrieved_at:        { dtype: str,  required: true }
      provenance_note:    { dtype: str,  required: true }

  creator_posts_enriched:
    description: >
      Interim Day 2 output of enrich_creator_posts() (Part E) as repaired by Day 2
      Task 1B (scripts/repair_day2_creator_evidence.py): Day 1 creator_posts plus
      YouTube-API/DDG-discovered candidates, with strict URL classification, creator
      identity resolution, and brand-link verification applied before
      corpus-building. Distinct from the Day 1 creator_posts candidate schema — do
      not route filenames here to that schema. post_url is populated for
      newly-enriched rows; pre-existing rows carry the same URL in source_url
      instead, so URL-presence is checked against either column (see
      validate_creator_posts_enriched in src/validation.py).
    fields:
      brand:                              { dtype: str,  required: true }
      platform:                            { dtype: str,  required: true }
      source_url:                          { dtype: str,  required: true }
      post_url:                            { dtype: str,  required: false }
      creator_handle:                      { dtype: str,  required: false }
      creator_identity_confidence:        { dtype: str,  required: true,
        values: [high, medium, low, unresolved] }
      url_validation_status:              { dtype: str,  required: true,
        values: [valid, invalid, lead_only] }
      direct_post_id:                      { dtype: str,  required: false }
      brand_link_verified:                { dtype: bool, required: true,  values: [true, false] }
      partnership_type:                    { dtype: str,  required: false,
        values: [unknown, unclear, organic, gifted, paid_sponsorship, ambassador, affiliate, founder_or_employee] }
      usable_as_creator_post:              { dtype: bool, required: true,  values: [true, false] }
      evidence_strength:                  { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }

  platform_strategy_enriched:
    description: >
      Interim Day 2 output of enrich_platform_strategy() (Part F): competitor/focal
      platform snapshots with inferred channel role, posting intent, and evidence
      strength from hydrating each platform's URL.
    fields:
      brand:              { dtype: str,  required: true }
      platform:            { dtype: str,  required: true }
      evidence_url:        { dtype: str,  required: true }
      evidence_strength:  { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }

  hydrated_sources:
    description: >
      Combined Day 2 hydration summary (Part I) across press, claims, reviews, and
      platform sources. Note: unlike the per-source hydrated_*.csv files (which carry
      h_final_url / h_hydrated_text / h_hydration_timestamp_utc), this rolled-up
      summary only carries the columns below — final_url/hydrated_text/
      hydration_timestamp_utc were requested but do not exist as columns in this
      specific file, so they are intentionally omitted here rather than invented.
    fields:
      source_type:        { dtype: str,  required: true }
      source_id:            { dtype: str,  required: true }
      brand:                { dtype: str,  required: true }
      source_url:          { dtype: str,  required: true }
      hydration_status:    { dtype: str,  required: true,  values: [success, cached, failed, skipped, blocked] }
      evidence_strength:  { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      rag_usable:          { dtype: bool, required: true,  values: [true, false] }
      text_length:          { dtype: int,  required: true }
      retrieved_at:        { dtype: str,  required: true }

  claim_assessments:
    description: >
      Researcher assessments of how well each official claim is supported or
      contradicted by customer/press/creator evidence. Output of Workstream 2.
    fields:
      assessment_id:          { dtype: str,   required: true }
      claim_id:               { dtype: str,   required: true }
      brand:                  { dtype: str,   required: true }
      claim_category:         { dtype: str,   required: true }
      claim_text:             { dtype: str,   required: true }
      supporting_evidence:    { dtype: str,   required: false }
      contradicting_evidence: { dtype: str,   required: false }
      supporting_source_ids:  { dtype: str,   required: false }
      contradicting_source_ids: { dtype: str, required: false }
      divergence_score:       { dtype: float, required: false, min: 0.0, max: 1.0 }
      assessor:               { dtype: str,   required: true,  values: [human, model, hybrid] }
      confidence:             { dtype: str,   required: false, values: [high, medium, low] }
      source_url:             { dtype: str,   required: false }
      source_platform:        { dtype: str,   required: false }
      collection_date:        { dtype: date,  required: true }
      collected_by:           { dtype: str,   required: true }
      evidence_type:          { dtype: str,   required: true,  values: [assessment] }
      notes:                  { dtype: str,   required: false }
      citation_ready:         { dtype: bool,  required: false, default: false }
      source_id:              { dtype: str,   required: true }
      synthetic:              { dtype: bool,  required: true,  default: false }

  # ── Day 2.5 schemas: Image / Video / Reference packages ───────────────────────
  # Assignment-alignment charter (CLAUDE.md §9, docs/project_charter.md). These
  # describe genuine media-asset manifests, distinct from any Day 2 corpus/creator
  # schema above. A row here is a MEDIA ASSET (image file, video file, or
  # candidate-evidence bundle), not a text document or a platform URL pointer.

  image_assets:
    description: >
      Image Package manifest (scripts/collect_official_product_media.py,
      data/interim/day2_5/image_assets.csv). One row per acquired or catalogued
      image. rights_or_access_basis is recorded separately from evidence_strength
      -- public availability does not by itself imply reuse rights.
    fields:
      asset_id:              { dtype: str,  required: true }
      brand:                  { dtype: str,  required: true }
      product_name:            { dtype: str,  required: false }
      product_category:        { dtype: str,  required: false }
      image_role:              { dtype: str,  required: true,
        values: [official_catalog, product_detail, permitted_ugc, creator_thumbnail, website_ui, packaging, material_or_label, other] }
      source_url:              { dtype: str,  required: true }
      source_page_url:        { dtype: str,  required: false }
      local_path:              { dtype: str,  required: false }
      rights_or_access_basis: { dtype: str,  required: true,
        values: [official_direct_public_asset, open_license, group_owned, user_authorised, platform_metadata_only, unknown] }
      retrieval_method:        { dtype: str,  required: true }
      retrieved_at:            { dtype: str,  required: true }
      width:                    { dtype: int,  required: false }
      height:                  { dtype: int,  required: false }
      file_hash:                { dtype: str,  required: false }
      evidence_strength:      { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      processing_status:      { dtype: str,  required: true,  values: [downloaded, discovered_not_downloaded, failed, skipped] }
      provenance_note:        { dtype: str,  required: false }

  video_assets:
    description: >
      Video Package manifest (scripts/build_video_asset_manifest.py,
      data/interim/day2_5/video_assets.csv). A row with
      rights_or_access_basis=platform_metadata_only is a VIDEO LEAD, not a
      processed video asset -- processing_status must be 'metadata_only' for such
      rows and can never be 'processed'. Only official_direct_public_asset,
      open_license, group_owned, or user_authorised rows may have
      processing_status=processed.
    fields:
      video_asset_id:          { dtype: str,  required: true }
      brand:                    { dtype: str,  required: true }
      creator_handle:          { dtype: str,  required: false }
      product_name:            { dtype: str,  required: false }
      product_category:        { dtype: str,  required: false }
      video_role:              { dtype: str,  required: true,
        values: [official_campaign, product_demonstration, try_on, unboxing, review, durability_test, wash_test, styling, responsibility_communication, other] }
      source_platform:        { dtype: str,  required: true }
      source_url:              { dtype: str,  required: true }
      asset_url:                { dtype: str,  required: false }
      local_path:              { dtype: str,  required: false }
      rights_or_access_basis: { dtype: str,  required: true,
        values: [official_direct_public_asset, open_license, group_owned, user_authorised, platform_metadata_only, unknown] }
      access_status:            { dtype: str,  required: true,
        values: [accessible, restricted, unavailable] }
      retrieval_method:        { dtype: str,  required: true }
      retrieved_at:            { dtype: str,  required: true }
      duration_seconds:        { dtype: float, required: false }
      file_hash:                { dtype: str,  required: false }
      transcript_available:    { dtype: bool, required: true,  values: [true, false] }
      processing_status:      { dtype: str,  required: true,
        values: [processed, metadata_only, failed, skipped] }
      evidence_strength:      { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      provenance_note:        { dtype: str,  required: false }

  video_frame_features:
    description: >
      Frame-level features for genuinely processed video assets only
      (src/video_features.py, data/processed/video_frame_features.csv). One row
      per sampled frame. A video_asset_id here must reference a video_assets row
      with processing_status=processed.
    fields:
      video_asset_id:          { dtype: str,  required: true }
      frame_id:                { dtype: str,  required: true }
      frame_index:              { dtype: int,  required: true }
      timestamp_seconds:        { dtype: float, required: true }
      sample_position:          { dtype: str,  required: true,
        values: [opening, quarter, half, three_quarter, closing, interval] }
      local_frame_path:        { dtype: str,  required: false }
      brightness:                { dtype: float, required: false }
      contrast:                  { dtype: float, required: false }
      saturation:                { dtype: float, required: false }
      dominant_color_group:    { dtype: str,  required: false }
      edge_density:              { dtype: float, required: false }
      perceptual_hash:          { dtype: str,  required: false }
      ocr_text:                  { dtype: str,  required: false }
      clip_embedding_available: { dtype: bool, required: true, values: [true, false] }
      clip_embedding_file_hash: { dtype: str,  required: false }
      product_semantic_similarity: { dtype: float, required: false, min: -1.0, max: 1.0 }

  video_level_features:
    description: >
      Video-level technical metadata + aggregated/temporal features
      (src/video_features.py, data/processed/video_level_features.csv). One row
      per genuinely processed video asset.
    fields:
      video_asset_id:              { dtype: str,  required: true }
      duration_seconds:            { dtype: float, required: true }
      width:                        { dtype: int,  required: false }
      height:                      { dtype: int,  required: false }
      fps:                          { dtype: float, required: false }
      frame_count:                  { dtype: int,  required: false }
      has_audio_stream:            { dtype: bool, required: false, values: [true, false] }
      aspect_ratio:                  { dtype: float, required: false }
      n_sampled_frames:            { dtype: int,  required: true }
      mean_brightness:              { dtype: float, required: false }
      brightness_variance:          { dtype: float, required: false }
      mean_contrast:                { dtype: float, required: false }
      contrast_variance:            { dtype: float, required: false }
      mean_saturation:              { dtype: float, required: false }
      saturation_variance:          { dtype: float, required: false }
      mean_edge_density:            { dtype: float, required: false }
      edge_density_variance:        { dtype: float, required: false }
      mean_inter_frame_perceptual_distance: { dtype: float, required: false }
      clip_embedding_change_mean:  { dtype: float, required: false }
      scene_change_count_proxy:    { dtype: int,  required: false }
      motion_intensity_proxy:      { dtype: float, required: false }
      visual_consistency_score:    { dtype: float, required: false }
      pct_frames_product_similar:  { dtype: float, required: false, min: 0.0, max: 1.0 }
      opening_to_closing_visual_change: { dtype: float, required: false }
      mean_frame_embedding_file_hash: { dtype: str, required: false }
      embedding_std:                { dtype: float, required: false }
      max_semantic_similarity:      { dtype: float, required: false, min: -1.0, max: 1.0 }
      transcript_text:              { dtype: str,  required: false }
      transcript_method:            { dtype: str,  required: false,
        values: [supplied, official_caption, permitted_public_transcript, local_asr, none] }
      transcript_language:          { dtype: str,  required: false }
      transcript_confidence_or_status: { dtype: str, required: false }
      transcript_file:              { dtype: str,  required: false }
      transcript_provenance:        { dtype: str,  required: false }

  multimodal_reference_assets:
    description: >
      Multimodal Reference Package manifest (Day 2.6A) --
      scripts/collect_reference_package.py,
      data/interim/day2_6/multimodal_reference_assets.csv. One row per
      discovered/fetched reference document: sustainability/impact pages,
      certifications, material/product specs, size/care guides, policies,
      supplier disclosures, brand style references. Superseded and replaced
      the earlier (Day 2.5) narrower schema -- reference_status is the
      authoritative field for whether a row counts as verified evidence.
    fields:
      reference_id:              { dtype: str,  required: true }
      brand:                      { dtype: str,  required: true }
      reference_type:            { dtype: str,  required: true,
        values: [impact_report, sustainability_page, certification, material_specification,
                 product_specification, care_guide, size_guide, return_policy,
                 quality_or_warranty_policy, supplier_disclosure, packaging_policy,
                 emissions_disclosure, labour_or_ethics_policy, brand_style_reference, other] }
      document_title:            { dtype: str,  required: false }
      source_url:                { dtype: str,  required: true }
      canonical_url:              { dtype: str,  required: false }
      source_domain:              { dtype: str,  required: false }
      publication_date:          { dtype: str,  required: false }
      effective_date:            { dtype: str,  required: false }
      retrieved_at:              { dtype: str,  required: true }
      mime_type:                  { dtype: str,  required: false }
      local_path:                { dtype: str,  required: false }
      extracted_text:            { dtype: str,  required: false }
      text_length:                { dtype: int,  required: false }
      page_count:                  { dtype: int,  required: false }
      has_tables:                  { dtype: bool, required: false, values: [true, false] }
      has_images:                  { dtype: bool, required: false, values: [true, false] }
      extraction_method:          { dtype: str,  required: false }
      evidence_strength:        { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      rights_or_access_basis:  { dtype: str,  required: true,
        values: [official_direct_public_asset, open_license, group_owned, user_authorised, platform_metadata_only, unknown] }
      processing_status:          { dtype: str,  required: false,
        values: [downloaded, failed, skipped] }
      file_hash:                  { dtype: str,  required: false }
      provenance_note:            { dtype: str,  required: false }
      discovery_method:          { dtype: str,  required: false,
        values: [existing_hydrated_source, common_slug_probe, sitemap, ddgs_discovery_then_direct_fetch, product_page_section_extraction] }
      official_source:            { dtype: bool, required: false, values: [true, false] }
      certification_authority:  { dtype: str,  required: false }
      claim_relevance:            { dtype: str,  required: false }
      reference_status:          { dtype: str,  required: true,
        values: [collected, already_available, not_found, blocked, irrelevant, duplicate, extraction_failed] }
      failure_reason:              { dtype: str,  required: false }

  reference_document_chunks:
    description: >
      Section-aware chunks of processed Multimodal Reference Package documents
      (src/reference_features.py, scripts/process_reference_package.py,
      data/processed/reference_document_chunks.csv). No embeddings/vector store
      here -- chunk construction with provenance only.
    fields:
      chunk_id:                    { dtype: str,  required: true }
      reference_id:                { dtype: str,  required: true }
      brand:                        { dtype: str,  required: true }
      reference_type:              { dtype: str,  required: false }
      document_title:              { dtype: str,  required: false }
      section_title:                { dtype: str,  required: false }
      page_number:                  { dtype: int,  required: false }
      chunk_sequence:                { dtype: int,  required: true }
      chunk_text:                    { dtype: str,  required: true }
      token_or_word_count:          { dtype: int,  required: true }
      numerical_claims:              { dtype: str,  required: false }
      materials:                      { dtype: str,  required: false }
      certifications:                { dtype: str,  required: false }
      geography:                      { dtype: str,  required: false }
      product_category:              { dtype: str,  required: false }
      source_url:                    { dtype: str,  required: true }
      evidence_strength:            { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      retrieved_at:                  { dtype: str,  required: false }
      provenance_note:              { dtype: str,  required: false }

  reference_tables:
    description: >
      Tables extracted from Multimodal Reference Package HTML documents
      (src/reference_features.py::extract_html_tables,
      data/processed/reference_tables.csv).
    fields:
      table_id:                            { dtype: str,  required: true }
      reference_id:                        { dtype: str,  required: true }
      page_number_or_section:              { dtype: str,  required: false }
      table_type:                          { dtype: str,  required: true,
        values: [size_chart, material_composition, emissions, supplier_list, certification, return_conditions, other] }
      headers:                              { dtype: str,  required: false }
      rows_or_normalised_text:            { dtype: str,  required: true }
      units:                                { dtype: str,  required: false }
      source_url:                          { dtype: str,  required: true }
      extraction_method:                    { dtype: str,  required: false }
      evidence_strength:                  { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      provenance_note:                      { dtype: str,  required: false }

  reference_images:
    description: >
      Document images (excluding decorative icons/logos, retaining
      certification badges) discovered in Multimodal Reference Package HTML
      documents (src/reference_features.py::extract_html_images,
      data/processed/reference_images.csv).
    fields:
      reference_image_id:          { dtype: str,  required: true }
      reference_id:                { dtype: str,  required: true }
      page_number_or_section:      { dtype: str,  required: false }
      image_role:                  { dtype: str,  required: true,
        values: [certification_badge, document_figure, other] }
      local_path:                  { dtype: str,  required: false }
      caption:                      { dtype: str,  required: false }
      ocr_text:                    { dtype: str,  required: false }
      width:                        { dtype: int,  required: false }
      height:                      { dtype: int,  required: false }
      file_hash:                    { dtype: str,  required: false }
      source_url:                  { dtype: str,  required: true }
      evidence_strength:          { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      provenance_note:            { dtype: str,  required: false }

  claim_multimodal_evidence_candidates:
    description: >
      Candidate (not yet scored) links between an official claim and
      text/image/video/reference evidence
      (scripts/build_claim_multimodal_candidates.py,
      data/processed/claim_multimodal_evidence_candidates.csv). Does not classify
      alignment/divergence -- that is a later fusion/scoring task. A claim may
      legitimately have missing modalities; do not fabricate a match merely to
      fill a field.
    fields:
      evidence_bundle_id:          { dtype: str,  required: true }
      claim_id:                    { dtype: str,  required: true }
      claim_text:                  { dtype: str,  required: true }
      claim_category:              { dtype: str,  required: false }
      product_name:                { dtype: str,  required: false }
      product_category:            { dtype: str,  required: false }
      text_evidence_ids:          { dtype: str,  required: false }
      image_asset_ids:            { dtype: str,  required: false }
      video_asset_ids:            { dtype: str,  required: false }
      reference_document_ids:    { dtype: str,  required: false }
      text_similarity:            { dtype: float, required: false, min: -1.0, max: 1.0 }
      image_similarity:            { dtype: float, required: false, min: -1.0, max: 1.0 }
      video_similarity:            { dtype: float, required: false, min: -1.0, max: 1.0 }
      evidence_strength_summary:  { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      missing_modalities:          { dtype: str,  required: true }
      candidate_generation_method: { dtype: str,  required: true }
      requires_human_validation:  { dtype: bool, required: true, values: [true, false] }
      provenance_note:            { dtype: str,  required: false }

  claim_evidence_units:
    description: >
      Day 3A primary multimodal fusion: one row per real evidence item matched
      to a real claim across text/image/video/reference modalities
      (src/fusion/*.py, scripts/run_primary_multimodal_fusion.py,
      data/processed/fusion/claim_evidence_units.csv). Stance is never fed the
      final fusion label back in -- it is derived only from the evidence item
      itself, per Part 6 of the Day 3A charter.
    fields:
      evidence_unit_id:                { dtype: str,  required: true }
      claim_id:                          { dtype: str,  required: true }
      claim_text:                        { dtype: str,  required: true }
      claim_category:                    { dtype: str,  required: true }
      modality:                          { dtype: str,  required: true,
        values: [text, image, video, reference] }
      evidence_id:                      { dtype: str,  required: true }
      source_type:                      { dtype: str,  required: false }
      source_url:                        { dtype: str,  required: false }
      source_independence:              { dtype: str,  required: true,
        values: [self_reported, customer_reported, independent, unclear] }
      evidence_strength:                { dtype: str,  required: true,  values: [strong, medium, weak, unusable] }
      relevance_score:                  { dtype: float, required: true }
      stance:                            { dtype: str,  required: true,
        values: [supports, challenges, neutral_context, unclear, not_applicable] }
      stance_score:                      { dtype: float, required: false }
      reliability_score:                { dtype: float, required: true, min: 0.0, max: 1.0 }
      visually_groundable:              { dtype: bool, required: false, values: [true, false] }
      visual_gate_passed:                { dtype: bool, required: false, values: [true, false] }
      brand_evidence_eligible:          { dtype: bool, required: true, values: [true, false] }
      evaluation_status:                { dtype: str,  required: true,  values: [automated_not_human_validated] }
      provisional_finding:              { dtype: bool, required: true, values: [true, false] }
      external_validation_recommended:  { dtype: bool, required: true, values: [true, false] }
      provenance_note:                  { dtype: str,  required: false }

  claim_fusion_results:
    description: >
      Day 3A decision-level fusion output: one automated, provisional result
      per real claim, never human-validated (src/fusion/evidence_fusion.py,
      scripts/run_primary_multimodal_fusion.py,
      data/processed/fusion/claim_fusion_results.csv).
    fields:
      claim_id:                          { dtype: str,  required: true }
      claim_category:                    { dtype: str,  required: false }
      official_disclosure_support:      { dtype: int,  required: true }
      independent_support:              { dtype: int,  required: true }
      evidence_conflict:                { dtype: bool, required: true, values: [true, false] }
      missing_modalities:                { dtype: str,  required: false }
      evidence_count:                    { dtype: int,  required: true }
      eligible_evidence_count:          { dtype: int,  required: true }
      self_reported_only:                { dtype: bool, required: true, values: [true, false] }
      confidence:                        { dtype: float, required: true, min: 0.0, max: 1.0 }
      automated_label:                  { dtype: str,  required: true,
        values: [aligned, partially_aligned, mixed, divergent, insufficient_evidence] }
      business_facing_label:            { dtype: str,  required: true }
      evaluation_status:                { dtype: str,  required: true,  values: [automated_not_human_validated] }
      provisional_finding:              { dtype: bool, required: true, values: [true, false] }
      external_validation_recommended:  { dtype: bool, required: true, values: [true, false] }
      presentation_restriction:          { dtype: str,  required: true,
        values: [may_present_as_automated_finding, present_with_strong_caveat, present_as_evidence_gap_finding_only, do_not_present_as_conclusion] }
      presentation_restriction_reason:  { dtype: str,  required: false }
      evidence_gap_finding:              { dtype: bool, required: true, values: [true, false] }

  fusion_unstable_claims:
    description: >
      Day 3A governance correction: every claim that cannot receive a plain
      may_present_as_automated_finding restriction, with the reason(s) why
      (src/fusion/presentation_governance.py,
      scripts/run_fusion_sensitivity.py,
      outputs/tables/fusion_unstable_claims.csv).
    fields:
      claim_id:                          { dtype: str,  required: true }
      claim_category:                    { dtype: str,  required: false }
      automated_label:                  { dtype: str,  required: true,
        values: [aligned, partially_aligned, mixed, divergent, insufficient_evidence] }
      confidence:                        { dtype: float, required: true, min: 0.0, max: 1.0 }
      self_reported_only:                { dtype: bool, required: true, values: [true, false] }
      presentation_restriction:          { dtype: str,  required: true,
        values: [may_present_as_automated_finding, present_with_strong_caveat, present_as_evidence_gap_finding_only, do_not_present_as_conclusion] }
      presentation_restriction_reason:  { dtype: str,  required: false }
      evidence_gap_finding:              { dtype: bool, required: true, values: [true, false] }
      sensitive_to_weights:              { dtype: bool, required: true, values: [true, false] }
      single_evidence_dependency:      { dtype: bool, required: true, values: [true, false] }
      provenance_failure:                { dtype: bool, required: true, values: [true, false] }
      groundability_failure:            { dtype: bool, required: true, values: [true, false] }

  fusion_sensitivity_stability:
    description: >
      Day 3A automated sensitivity analysis: per-claim stability of the
      automated_label under reasonable, documented perturbations of
      configs/fusion_rules.yaml (scripts/run_fusion_sensitivity.py,
      outputs/tables/fusion_sensitivity_stability.csv). No human labelling.
    fields:
      claim_id:                                { dtype: str,  required: true }
      baseline_label:                          { dtype: str,  required: true }
      n_distinct_labels_across_scenarios:      { dtype: int,  required: true }
      label_stable:                            { dtype: bool, required: true, values: [true, false] }
      confidence_std_across_scenarios:        { dtype: float, required: true }
      single_evidence_dependency:              { dtype: bool, required: true, values: [true, false] }
      restrictive_presentation_required:      { dtype: bool, required: true, values: [true, false] }

  automated_fusion_evaluation:
    description: >
      Day 3A automated evaluation (methods A-E): synthetic test cases,
      modality-ablation reuse, sensitivity reuse, cross-method rule-based vs.
      NLI comparison (never called human agreement or Cohen's kappa), and
      provenance/groundedness checks (src/fusion/automated_evaluation.py,
      scripts/run_fusion_sensitivity.py,
      outputs/tables/automated_fusion_evaluation.csv). No manual coding or
      human-coder adjudication is used anywhere in this table.
    fields:
      evaluation_id:          { dtype: str,  required: true }
      evaluation_type:        { dtype: str,  required: true,
        values: [synthetic_test_case, modality_ablation, sensitivity_reuse, cross_method_nli_comparison, provenance_groundedness, presentation_governance] }
      claim_id:                { dtype: str,  required: false }
      test_case_id:            { dtype: str,  required: false }
      expected_property:      { dtype: str,  required: true }
      observed_property:      { dtype: str,  required: true }
      passed:                  { dtype: bool, required: true, values: [true, false] }
      failure_reason:          { dtype: str,  required: false }
      method:                  { dtype: str,  required: true }
      generated_at:            { dtype: str,  required: true }

  rag_collection_summary:
    description: >
      Day 3B: per-collection build summary from the ChromaDB index builder
      (scripts/build_chroma_index.py, outputs/tables/rag_collection_summary.csv).
    fields:
      collection:                        { dtype: str, required: true,
        values: [tala_claims, tala_text_evidence, tala_visual_evidence] }
      n_final:                            { dtype: int, required: true }
      n_upserted_this_run:                { dtype: int, required: true }
      n_removed_stale_this_run:          { dtype: int, required: true }
      n_missing_asset_rejected:          { dtype: int, required: false }
      n_embed_failed_rejected:            { dtype: int, required: false }

  rag_corpus_coverage:
    description: >
      Day 3B: per-collection coverage by brand/source_type/evidence_strength
      (scripts/build_chroma_index.py, outputs/tables/rag_corpus_coverage.csv).
    fields:
      collection:  { dtype: str, required: true }
      dimension:  { dtype: str, required: true, values: [brand, source_type, evidence_strength] }
      value:        { dtype: str, required: true }
      n_rows:      { dtype: int, required: true }

  rag_modality_coverage:
    description: >
      Day 3B: per-collection row counts by modality
      (scripts/build_chroma_index.py, outputs/tables/rag_modality_coverage.csv).
    fields:
      collection: { dtype: str, required: true }
      modality:    { dtype: str, required: true }
      n_rows:      { dtype: int, required: true }

  rag_retrieval_evaluation:
    description: >
      Day 3B: automated retrieval evaluation -- collection integrity, metadata
      completeness, missing-asset rate, direct-link recall@k/MRR
      (scripts/run_multimodal_rag_evaluation.py,
      outputs/tables/rag_retrieval_evaluation.csv). Heterogeneous metric rows
      by design (metric_group distinguishes the evaluation method).
    fields:
      metric_group: { dtype: str, required: false }
      collection:    { dtype: str, required: false }
      metric:        { dtype: str, required: false }
      value:          { dtype: float, required: false }

  rag_query_routing_evaluation:
    description: >
      Day 3B: per-claim modality-routing correctness against the authoritative
      Day 3A visual-groundability rule
      (scripts/run_multimodal_rag_evaluation.py,
      outputs/tables/rag_query_routing_evaluation.csv).
    fields:
      claim_id:                          { dtype: str,  required: true }
      claim_category:                    { dtype: str,  required: true }
      expected_visually_groundable:      { dtype: bool, required: true, values: [true, false] }
      actual_routed_visual:              { dtype: bool, required: true, values: [true, false] }
      routing_correct:                    { dtype: bool, required: true, values: [true, false] }

  rag_citation_validation:
    description: >
      Day 3B: automated citation-validation results for the live Gemini demo
      cases (scripts/run_multimodal_rag_evaluation.py,
      outputs/tables/rag_citation_validation.csv). No human-coder review.
    fields:
      demo_case:  { dtype: str,  required: true }
      claim_id:    { dtype: str,  required: false }
      passed:      { dtype: bool, required: true, values: [true, false] }
      failures:    { dtype: str,  required: false }

  rag_latency_summary:
    description: >
      Day 3B: retrieval/end-to-end latency by pipeline stage
      (scripts/run_multimodal_rag_evaluation.py,
      outputs/tables/rag_latency_summary.csv).
    fields:
      stage:            { dtype: str,  required: true }
      latency_seconds: { dtype: float, required: true, min: 0.0 }

  rag_demo_cases:
    description: >
      Day 3B: outcome of the required demonstration cases (text+image+video
      claim, mixed-claim explanation, insufficient-evidence explanation)
      (scripts/run_multimodal_rag_evaluation.py,
      outputs/tables/rag_demo_cases.csv). Records the real API outcome
      (including quota/availability failures) -- never fabricated.
    fields:
      demo_case:  { dtype: str,  required: true }
      claim_id:    { dtype: str,  required: false }
      outcome:    { dtype: str,  required: true }
      api_outcome: { dtype: str, required: false }

  rag_go_no_go:
    description: >
      Day 3B: final acceptance-gate GO/NO-GO/PARTIAL determination
      (scripts/run_multimodal_rag_evaluation.py,
      outputs/tables/rag_go_no_go.csv). A genuine failure is reported as
      NO-GO or PARTIAL, never weakened to force a GO.
    fields:
      gate:      { dtype: str, required: true }
      status:    { dtype: str, required: true, values: [GO, "NO-GO", PARTIAL, NOT_ATTEMPTED] }

  # ── Day 3C: executive analytical synthesis + creator-strategy comparison ──
  # scripts/build_analytical_synthesis.py, scripts/build_creator_strategy_comparison.py,
  # scripts/build_strategic_interpretation.py, scripts/build_executive_findings.py.
  # All read-only over existing verified Day 2/3A/3B outputs -- no new collection,
  # no external API calls, descriptive only (see docs/project_charter.md).

  analytical_synthesis_claim_master:
    description: >
      Authoritative claim-level synthesis covering all 37 TALA claims, joining
      Day 3A fusion labels to evidence-unit counts by modality and role.
    fields:
      claim_id:                 { dtype: str,  required: true }
      claim_text:                { dtype: str,  required: true }
      claim_category:            { dtype: str,  required: true }
      official_source_id:        { dtype: str,  required: true }
      production_fusion_label:  { dtype: str,  required: true, values: [aligned, partially_aligned, mixed, divergent, insufficient_evidence] }
      fusion_confidence:        { dtype: float, required: true, min: 0.0, max: 1.0 }
      evidence_unit_count:      { dtype: int,   required: true, min: 0 }

  claim_label_summary:
    description: >
      Overall/category/confidence/restriction distribution of the 37 claim
      fusion labels, with zero-count classes retained explicitly.
    fields:
      automated_label: { dtype: str, required: true }
      n_claims:         { dtype: int, required: true, min: 0 }
      section:          { dtype: str, required: true }

  mixed_claim_deep_dive:
    description: >
      Per-claim narrative deep dive for every production claim labelled mixed.
      theme_id (added by the acceptance patch) links each of the 5 claim
      records to its row in mixed_claim_theme_summary.
    fields:
      claim_id:              { dtype: str, required: true }
      exact_official_claim:  { dtype: str, required: true }
      claim_category:        { dtype: str, required: true }
      theme_id:                { dtype: str, required: true, values: [theme_01, theme_02] }

  mixed_claim_theme_summary:
    description: >
      Consolidates the 5 mixed claim RECORDS into their underlying strategic
      THEMES (deterministic text-match grouping, no LLM). Does not alter the
      authoritative Day 3A claim-level fusion labels.
    fields:
      theme_id:            { dtype: str, required: true }
      theme_name:            { dtype: str, required: true }
      claim_record_count:  { dtype: int,  required: true, min: 1 }
      claim_ids:            { dtype: str, required: true }

  aligned_claim_examples:
    description: >
      Two-to-four decision-relevant aligned claims selected by transparent
      criteria (supporting_evidence_count>=2, label stable across weighting).
    fields:
      claim_id:            { dtype: str, required: true }
      claim_text:           { dtype: str, required: true }
      selection_criteria:  { dtype: str, required: true }

  insufficient_evidence_analysis:
    description: >
      Gap classification for every claim labelled insufficient_evidence.
    fields:
      claim_id:         { dtype: str, required: true }
      claim_category:   { dtype: str, required: true }
      reason_code:      { dtype: int, required: true, values: [1, 2, 3, 4, 5] }
      reason_label:      { dtype: str, required: true }

  modality_contribution_summary:
    description: >
      Text-only vs. text+image vs. text+image+video vs. full-modality fusion
      configuration comparison, plus evidence-unit counts by modality.
    fields:
      section: { dtype: str, required: true }

  evidence_gap_by_category:
    description: >
      Per claim-category summary of independent/customer/image/video/reference
      evidence coverage and the dominant missing evidence type.
    fields:
      claim_category: { dtype: str, required: true }
      total_claims:    { dtype: int, required: true, min: 0 }

  creator_strategy_evidence_coverage:
    description: >
      Verified creator/official-platform record counts and coverage
      limitations for TALA, Adanola, Girlfriend Collective, Oner Active.
    fields:
      brand:                      { dtype: str, required: true, values: [TALA, Adanola, "Girlfriend Collective", "Oner Active"] }
      verified_creator_records:  { dtype: int, required: true, min: 0 }
      analysis_prohibited:       { dtype: str, required: true }

  creator_partnership_mix:
    description: >
      Count and within-brand percentage for each evidence-gated partnership
      type, per brand, with the brand denominator retained.
    fields:
      brand:              { dtype: str,   required: true, values: [TALA, Adanola, "Girlfriend Collective", "Oner Active"] }
      partnership_type:    { dtype: str,   required: true }
      count:               { dtype: int,   required: true, min: 0 }
      pct_within_brand:    { dtype: float, required: true, min: 0.0 }
      brand_denominator_n: { dtype: int,   required: true, min: 0 }

  creator_content_intent_mix:
    description: >
      Count and within-brand percentage for each classified content-intent
      category, per brand, retaining zero-count categories.
    fields:
      brand:              { dtype: str,   required: true, values: [TALA, Adanola, "Girlfriend Collective", "Oner Active"] }
      content_intent:      { dtype: str,   required: true }
      count:               { dtype: int,   required: true, min: 0 }
      brand_denominator_n: { dtype: int,   required: true, min: 0 }

  creator_partnership_intent_matrix:
    description: >
      Partnership-type x content-intent matrix at overall / by-brand /
      non-organic-only / non-organic-by-brand scopes.
    fields:
      scope:            { dtype: str, required: true }
      brand:             { dtype: str, required: true }
      partnership_type: { dtype: str, required: true }
      content_intent:    { dtype: str, required: true }
      count:             { dtype: int, required: true, min: 0 }

  brand_platform_strategy_comparison:
    description: >
      Observed platform role (creator-led vs brand-led, product-demo,
      responsibility, commerce) per brand per verified platform.
    fields:
      brand:    { dtype: str, required: true, values: [TALA, Adanola, "Girlfriend Collective", "Oner Active"] }
      platform: { dtype: str, required: true }

  creator_strategic_pattern_metrics:
    description: >
      Descriptive concentration (HHI) and share metrics per brand; no
      significance testing on this targeted, non-random corpus.
    fields:
      brand: { dtype: str, required: true, values: [TALA, Adanola, "Girlfriend Collective", "Oner Active"] }
      n:      { dtype: int, required: true, min: 0 }

  creator_strategy_interpretation:
    description: >
      Per-brand strategic pattern, split into observed_finding /
      interpretation / hypothesis rows (never merged into one claim).
    fields:
      brand:      { dtype: str, required: true, values: [TALA, Adanola, "Girlfriend Collective", "Oner Active"] }
      level:      { dtype: str, required: true, values: [observed_finding, interpretation, hypothesis] }
      statement:  { dtype: str, required: true }

  tala_competitor_lessons:
    description: >
      Competitor practices TALA could preserve/test/avoid-copying, each tied
      to a supporting record count and evidence IDs.
    fields:
      lesson_id:                       { dtype: str, required: true }
      comparator_brand:                { dtype: str, required: true }
      observed_competitor_practice:    { dtype: str, required: true }
      supporting_record_count:        { dtype: int,  required: true, min: 0 }
      lesson_category:                  { dtype: str, required: true, values: [preserve, test, avoid_copying_without_validation, evidence_gap] }

  creator_moat_hypotheses:
    description: >
      Moat hypotheses meeting all 5 criteria in the task brief. status is
      never "proven moat" -- only plausible/weak/unsupported/contradicted.
    fields:
      hypothesis_id:            { dtype: str, required: true }
      brand:                     { dtype: str, required: true, values: [TALA, Adanola, "Girlfriend Collective", "Oner Active"] }
      verified_evidence_count:  { dtype: int,  required: true, min: 0 }
      status:                    { dtype: str, required: true, values: [plausible, weak, unsupported, contradicted] }

  professor_feedback_response:
    description: >
      Evidence-controlled answers to the professor's six creator-strategy
      questions, each tied to an evidence_basis table.
    fields:
      question_id: { dtype: str, required: true }
      question:     { dtype: str, required: true }
      answer:       { dtype: str, required: true }
      evidence_basis: { dtype: str, required: true }

  executive_finding_register:
    description: >
      ~8-12 prioritised, deck-ready executive findings spanning both the
      claim-experience and creator-strategy analytical streams.
    fields:
      finding_id:          { dtype: str, required: true }
      analytical_stream:  { dtype: str, required: true, values: ["claim–experience divergence", "modality contribution", "evidence gaps", "creator strategy", "competitor learning", "moat hypothesis"] }
      finding:              { dtype: str, required: true }
      observed_or_inferred: { dtype: str, required: true, values: [observed, hypothesis, inferred] }

  # ── Day 3D: AI governance, ethics and ESG framework ──────────────────────
  # scripts/build_governance_framework.py. Read-only over existing verified
  # Day 3A/3C outputs plus hand-curated, source-cited governance content
  # (verified 22 September 2026) -- no new data collection, no external API
  # calls, no change to any analytical result.

  ai_governance_risk_register:
    description: >
      5x5 (likelihood x impact) risk register covering privacy, media rights,
      evidence quality, creator/customer ethics, GenAI vendor, and security
      risk domains. Scores are structured management judgements, not
      empirical probabilities.
    fields:
      risk_id:                 { dtype: str,  required: true }
      risk_domain:              { dtype: str,  required: true }
      likelihood_1_5:            { dtype: int,  required: true, min: 1, max: 5 }
      impact_1_5:                { dtype: int,  required: true, min: 1, max: 5 }
      inherent_risk_score:      { dtype: int,  required: true, min: 1, max: 25 }
      inherent_risk_level:      { dtype: str,  required: true, values: [Low, Medium, High, Critical] }
      control_status:            { dtype: str,  required: true, values: [Implemented, "Partially implemented", Proposed, "Not applicable"] }
      residual_risk_level:      { dtype: str,  required: true, values: [Low, Medium, High, Critical] }
      risk_owner:                { dtype: str,  required: true }

  ai_governance_control_matrix:
    description: >
      Preventive/detective/corrective controls mapped to governance layers
      (data admission, modality processing, fusion, retrieval/generation,
      managerial use) and to risk_ids in ai_governance_risk_register.
    fields:
      control_id:        { dtype: str, required: true }
      governance_layer:  { dtype: str, required: true }
      control_type:      { dtype: str, required: true, values: [Preventive, Detective, Corrective] }
      control_status:    { dtype: str, required: true, values: [Implemented, "Partially implemented", Proposed, "Not applicable"] }
      control_owner:      { dtype: str, required: true }

  claim_decision_policy:
    description: >
      Permitted management use, required reviewer, and recommended/prohibited
      wording for each fusion label (aligned/partially_aligned/mixed/
      divergent/insufficient_evidence).
    fields:
      decision_label:   { dtype: str, required: true, values: [aligned, partially_aligned, mixed, divergent, insufficient_evidence] }
      meaning:           { dtype: str, required: true }
      what_it_does_not_mean: { dtype: str, required: true }
      required_reviewer: { dtype: str, required: true }

  ai_governance_raci:
    description: >
      RACI matrix (one column per role) across governance activities; every
      activity has exactly one Accountable ('A') role.
    fields:
      activity_id: { dtype: str, required: true }
      activity:     { dtype: str, required: true }

  ai_data_lifecycle_policy:
    description: >
      Data-involved, minimisation, access, retention and deletion rules for
      every lifecycle stage from discovery through deletion.
    fields:
      lifecycle_stage:            { dtype: str, required: true }
      personal_data_risk:          { dtype: str, required: true }
      existing_or_proposed_status: { dtype: str, required: true }

  esg_claim_assurance_matrix:
    description: >
      Acceptable/ineligible evidence types, substantiation thresholds, and
      current TALA evidence status per ESG-relevant claim category.
    fields:
      claim_category:                { dtype: str, required: true }
      acceptable_official_evidence:  { dtype: str, required: true }
      current_evidence_gap:          { dtype: str, required: true }

  regulatory_standards_map:
    description: >
      Regulatory/standards requirements relevant to this system, each with an
      official source URL (or TBC), verified 22 September 2026. Voluntary
      standards are never labelled mandatory.
    fields:
      requirement_id:      { dtype: str,  required: true }
      authority:             { dtype: str,  required: true }
      mandatory_status:      { dtype: str,  required: true }
      official_url:          { dtype: str,  required: true }
      access_date:            { dtype: str,  required: true }
      legal_review_required: { dtype: bool, required: true }

  genai_vendor_control_matrix:
    description: >
      Gemini API vendor controls; documents that there is no fallback model
      and that the correct failure behaviour is to stop generation and show
      a clear error.
    fields:
      control_area:        { dtype: str, required: true }
      control_description: { dtype: str, required: true }
      status:                { dtype: str, required: true }

  ai_governance_kpi_kri:
    description: >
      Monitoring indicators with formula, target/warning/breach thresholds,
      and owner. current_value is computed from repository outputs where
      feasible and 'TBC' elsewhere -- never fabricated.
    fields:
      kpi_kri:        { dtype: str, required: true }
      definition:      { dtype: str, required: true }
      formula:          { dtype: str, required: true }
      current_value:    { dtype: str, required: true }
      owner:            { dtype: str, required: true }

  ai_incident_escalation_matrix:
    description: >
      Incident scenarios with severity, containment, ownership and target
      response time.
    fields:
      incident_scenario:    { dtype: str, required: true }
      severity:              { dtype: str, required: true, values: [Low, Medium, High, Critical] }
      notification_owner:    { dtype: str, required: true }
      target_response_time: { dtype: str, required: true }

  ai_governance_implementation_roadmap:
    description: >
      Four-phase roadmap (academic prototype; 0-30 day pilot; 31-90 day
      limited deployment; 3-6 month scaled deployment); every item has a
      completion_criterion.
    fields:
      phase:                { dtype: str, required: true }
      initiative:            { dtype: str, required: true }
      deliverable:            { dtype: str, required: true }
      owner:                  { dtype: str, required: true }
      completion_criterion:  { dtype: str, required: true }

  ai_governance_go_no_go:
    description: >
      Deployment-readiness gates assessed separately for academic
      demonstration, controlled internal pilot, and external/customer-facing
      deployment. Outcomes are evidence-based, not preassigned.
    fields:
      gate:              { dtype: str, required: true }
      deployment_context: { dtype: str, required: true, values: [academic_demonstration_readiness, controlled_internal_pilot_readiness, external_customer_facing_deployment_readiness] }
      status:              { dtype: str, required: true, values: [GO, PARTIAL, "NO-GO"] }
