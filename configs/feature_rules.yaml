# ── Partnership disclosure phrases (Day 2 Task 2B Part C) ─────────────────────
# Used by src/collectors/creator_identity.py::reassess_partnership() against the
# FULL video title + description (not just a truncated caption snippet). Grouped
# by the controlled-vocabulary category each phrase is explicit evidence for.
# A bare brand-name mention is NEVER sufficient on its own -- only these phrases.
partnership_disclosure_phrases:
  paid_sponsorship:
    - "paid promotion"
    - "paid partnership"
    - "paid ad"
    - "#ad"
    - "#sponsored"
    - "sponsored by"
    - "for sponsoring"
    - "this video is sponsored"
  gifted:
    - "#gifted"
    - "gifted"
    - "pr product"
    - "press sample"
    - "c/o"
    - "sent to me"
    - "sent by"
  ambassador:
    - "ambassador"
    - "brand rep"
  affiliate:
    - "affiliate link"
    - "affiliate"
    - "commission disclosure"
    - "tracked affiliate url"
    - "earn a commission"
    - "use my code"
    - "discount code"
    - "promo code"
  founder_or_employee:
    - "founder"
    - "co-founder"
    - "co founder"
    - "our team"
    - "i work at"
    - "i work for"

